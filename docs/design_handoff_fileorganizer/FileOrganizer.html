<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>FileOrganizer</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="styles.css" />
<style>
  html, body, #root { height: 100%; margin: 0; background: #0a0b0d; color: #e8e9ec; font-family: 'Inter Tight', system-ui, sans-serif; }
  .stage-bg {
    position: fixed; inset: 0; z-index: -1;
    background: radial-gradient(ellipse at top, oklch(0.22 0.02 60) 0%, #0a0b0d 60%);
  }
  .stage-bg::after {
    content: ''; position: absolute; inset: 0;
    background-image:
      linear-gradient(rgba(255,255,255,0.025) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255,255,255,0.025) 1px, transparent 1px);
    background-size: 48px 48px;
    mask-image: radial-gradient(ellipse at center, #000 30%, transparent 75%);
    -webkit-mask-image: radial-gradient(ellipse at center, #000 30%, transparent 75%);
  }
</style>
</head>
<body>
<div class="stage-bg"></div>
<div id="root"></div>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<script src="fo-data.js"></script>
<script type="text/babel" src="var-a.jsx"></script>

<script type="text/babel">
const { useState, useEffect } = React;

function App() {
  const [scale, setScale] = useState(1);
  useEffect(() => {
    const compute = () => {
      const W = window.innerWidth - 80;
      const H = window.innerHeight - 100;
      setScale(Math.min(W / 1440, H / 900, 1));
    };
    compute();
    window.addEventListener('resize', compute);
    return () => window.removeEventListener('resize', compute);
  }, []);

  return (
    <div style={{ minHeight: '100%', display: 'flex', flexDirection: 'column' }}>
      <header style={{ padding: '20px 32px 14px', display: 'flex', alignItems: 'center', gap: 16 }}>
        <div style={{
          width: 28, height: 28, borderRadius: 6,
          background: 'linear-gradient(135deg, oklch(0.74 0.14 70), oklch(0.58 0.13 50))',
          display: 'flex', alignItems: 'center', justifyContent: 'center',
          fontFamily: 'JetBrains Mono, monospace', fontWeight: 700, fontSize: 13, color: '#1a120a',
        }}>fo</div>
        <div>
          <div style={{ fontSize: 14, fontWeight: 600 }}>FileOrganizer</div>
          <div style={{ fontSize: 11, color: '#7e828a', fontFamily: 'JetBrains Mono' }}>local · 5 drives · 1.28M files indexed</div>
        </div>
      </header>

      <div style={{ flex: 1, display: 'flex', flexDirection: 'column', alignItems: 'center', justifyContent: 'flex-start', padding: '8px 40px 48px' }}>
        <div style={{ width: 1440 * scale, height: 900 * scale, position: 'relative' }}>
          <div style={{
            width: 1440, height: 900,
            transform: `scale(${scale})`, transformOrigin: 'top left',
            borderRadius: 8, overflow: 'hidden',
            border: '1px solid rgba(255,255,255,0.08)',
            boxShadow: '0 30px 80px rgba(0,0,0,0.5), 0 8px 24px rgba(0,0,0,0.3)',
            background: '#0e0f12',
          }}>
            <window.VarA />
          </div>
        </div>
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
